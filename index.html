<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Conner's Adventure Game</title>
		<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
		<link rel="stylesheet" href="styles.css" />
	</head>

	<body>
		<div id="container">
			<div id="title"></div>
			<div id="choices"></div>
		</div>

		<div id="eventContainer">
			<img id="ominousBlackCube" class="event" src="assets/ominousBlackCube.gif" />
			<img id="cat" class="event" src="assets/cat.gif" />
			<img id="newFoeImage" class="event" src="assets/champ/champ_newfoe.png" />
			<div id="battleUI">
				<div id="champStats">
					<img class="champStatBG" src="assets/champ/champStats.svg" />
					<div class="champStatTxt">
						<h1>Champ</h1>
						<div class="hp-bar-container">
							<div id="champHpBar" class="hp-bar-fill" style="width: 100%"></div>
						</div>
						<div id="champHP">- / -</div>
					</div>
				</div>
				<div id="playerUI">
					<img class="playerBG" src="assets/champ/playerUI.svg" />
					<div class="playerStatTxt">
						<h1>You</h1>
						<div class="hp-bar-container">
							<div id="playerHpBar" class="hp-bar-fill" style="width: 100%"></div>
						</div>
						<div id="playerHP">- / -</div>
					</div>
					<div id="battleMessage"><h2>Lorum ipsum...</h2></div>
					<div id="battleOptions"></div>
				</div>
			</div>
		</div>

		<div id="champ" class="event">
			<img id="champ-img" src="assets/champ/champ-pose.png" />
			<div id="champ-shadow"></div>
		</div>

		<script src="js/helper.js"></script>
		<script src="js/levels.js"></script>
		<script src="js/champBattle.js"></script>
		<script src="js/script.js"></script>
		<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
	</body>
</html>
